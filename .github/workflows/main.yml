 
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Link Expo project
        run: eas init --id 1b602cea-3e42-4e0e-a926-42ec9612742d --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with retries
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if eas build --platform android --profile preview --non-interactive; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed. Waiting 30 seconds before retry."
              sleep 30
            fi
          done
          exit 1
