 
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check installed packages
        run: |
          echo "Checking PDF package..."
          npm ls react-native-pdf || true
          echo "Checking Expo Asset..."
          npm ls expo-asset || true
          echo "Checking Expo Constants..."
          npm ls expo-constants || true

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Link Expo project
        run: eas init --id 1b602cea-3e42-4e0e-a926-42ec9612742d --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
